<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>المنتج</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: { sans: ['Almarai', 'sans-serif'], display: ['Lalezar', 'sans-serif'] },
      colors: { ink: '#111827', forest: '#000000', sand: '#ffffff' } } }
  }
</script>
</head>
<body class="font-sans bg-gray-50 text-gray-900 pb-20 md:pb-0">
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-200 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/" class="text-2xl brand-logo font-black">متجري</a>
      <button id="cartBtn" class="relative flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-bold bg-black text-white hover:bg-gray-800 transition-colors shadow-sm hidden md:flex">
        🛒 السلة <span id="cartCount" class="absolute -top-2 -left-2 bg-gold text-ink text-xs font-black w-5 h-5 rounded-full flex items-center justify-center border border-gray-100">0</span>
      </button>
    </div>
  </header>

  <main id="productDetail" class="max-w-4xl mx-auto px-4 py-8"></main>

  <footer class="border-t-2 border-ink mt-10 py-8 text-center text-sm">
    <p class="font-display text-2xl text-forest-dark mb-3 font-black">تابعنا على وسائل التواصل</p>
    <div id="socialIconsProductFooter" class="flex items-center justify-center gap-3 mb-4"></div>
    <p class="text-ink font-bold">© 2026 متجري - جميع الحقوق محفوظة</p>
  </footer>

  <!-- سلة التسوق (Drawer) -->
  <div id="cartOverlay" class="fixed inset-0 bg-ink/40 hidden z-50"></div>
  <aside id="cartDrawer" class="fixed top-0 left-0 h-full w-full max-w-sm bg-sand z-50 translate-x-[-100%] transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-4 border-b-2 border-ink flex items-center justify-between">
      <h2 class="font-display text-2xl font-black text-ink">سلة التسوق</h2>
      <button id="closeCart" class="text-2xl leading-none font-black text-ink hover:text-forest">&times;</button>
    </div>
    <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <div class="p-4 border-t-2 border-ink">
      <div class="flex justify-between items-center font-black text-ink mb-3">
        <span class="text-base">الإجمالي</span>
        <span id="cartTotal" class="price-ticket lg">0 دج</span>
      </div>
      <button id="checkoutBtn" class="btn-primary w-full py-3 rounded-xl font-black text-base">إتمام الطلب الآن</button>
    </div>
  </aside>

  <!-- نموذج إتمام الطلب (Checkout Modal) -->
  <div id="checkoutOverlay" class="fixed inset-0 bg-ink/40 hidden z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-sand border border-gray-100 rounded-2xl w-full max-w-md p-6 my-8 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display text-2xl font-black text-ink">معلومات التوصيل</h2>
        <button id="cancelCheckoutHeader" class="text-2xl leading-none font-black text-ink hover:text-terracotta">&times;</button>
      </div>
      <form id="checkoutForm" class="space-y-3">
        <input required name="customer_name" placeholder="الاسم الكامل" class="field w-full px-3 py-2 text-sm font-bold text-ink" />
        <input required name="phone" placeholder="رقم الهاتف" class="field w-full px-3 py-2 text-sm font-bold text-ink" />

        <div class="grid grid-cols-2 gap-2">
          <select required id="wilayaSelect" name="wilaya_code" class="field w-full px-3 py-2 text-sm font-bold text-ink">
            <option value="">الولاية...</option>
          </select>
          <select required id="communeSelect" name="commune" class="field w-full px-3 py-2 text-sm font-bold text-ink" disabled>
            <option value="">البلدية...</option>
          </select>
        </div>

        <textarea required name="address" placeholder="العنوان بالتفصيل (الحي، الشارع، رقم المنزل...)" class="field w-full px-3 py-2 text-sm font-bold text-ink" rows="2"></textarea>

        <div>
          <p class="text-xs font-black text-ink mb-2">طريقة التوصيل</p>
          <div class="grid grid-cols-2 gap-2">
            <label class="delivery-option flex flex-col items-center py-3 px-2 text-center selected" data-type="home">
              <input type="radio" name="delivery_type" value="home" class="hidden" checked />
              <span class="text-lg">🏠</span>
              <span class="text-xs font-black mt-1 text-ink">للمنزل</span>
              <span class="delivery-price text-xs font-black mt-1">—</span>
            </label>
            <label class="delivery-option flex flex-col items-center py-3 px-2 text-center" data-type="desk">
              <input type="radio" name="delivery_type" value="desk" class="hidden" />
              <span class="text-lg">🏤</span>
              <span class="text-xs font-black mt-1 text-ink">مكتب البريد</span>
              <span class="delivery-price text-xs font-black mt-1">—</span>
            </label>
          </div>
          <p id="selectWilayaHint" class="text-xs text-ink font-bold mt-1">اختر الولاية أولًا لمعرفة سعر التوصيل</p>
        </div>

        <div class="flex justify-between items-center pt-2 border-t-2 border-dashed border-ink/30">
          <span class="text-sm font-black text-ink">إجمالي الطلب مع التوصيل</span>
          <span id="checkoutGrandTotal" class="price-ticket font-black">0 دج</span>
        </div>

        <p id="checkoutError" class="text-rose-700 text-sm font-black hidden"></p>
        <div class="flex gap-2 pt-2">
          <button type="button" id="cancelCheckout" class="btn-outline flex-1 py-2.5 rounded-xl text-sm font-black">إلغاء</button>
          <button type="submit" id="submitOrderBtn" class="btn-primary flex-1 py-2.5 rounded-xl text-sm font-black">تأكيد الطلب</button>
        </div>
      </form>
    </div>
  </div>

  <div id="successToast" class="hidden fixed bottom-6 right-6 bg-forest text-white px-5 py-3 rounded-xl shadow-lg z-[60] font-bold border-2 border-forest-dark"></div>

  <!-- المُكبِّر (Lightbox) لصور المنتج -->
  <div id="lightbox" class="hidden fixed inset-0 bg-black/90 z-[70] items-center justify-center">
    <button id="lightboxClose" class="absolute top-4 left-4 text-white text-3xl leading-none z-10">&times;</button>
    <button id="lightboxPrev" class="absolute left-2 md:left-6 top-1/2 -translate-y-1/2 text-white text-4xl z-10 px-2 select-none">&#8249;</button>
    <img id="lightboxImg" src="/img/placeholder.svg" class="max-h-[92vh] max-w-[96vw] w-auto h-auto object-contain select-none" />
    <button id="lightboxNext" class="absolute right-2 md:right-6 top-1/2 -translate-y-1/2 text-white text-4xl z-10 px-2 select-none">&#8250;</button>
    <div id="lightboxCounter" class="absolute bottom-5 left-1/2 -translate-x-1/2 text-white text-sm font-bold bg-white/10 px-3 py-1 rounded-full"></div>
  </div>

  <script src="/js/cart.js"></script>
  <script src="/js/locations.js"></script>
  <script src="/js/social.js"></script>
  <script>
    let CURRENT_DELIVERY_TYPE = 'home';
    let PRODUCT_QTY = 1;

    // ---------- التقاط UTM من رابط الزيارة وحفظها في sessionStorage ----------
    (function captureUtm() {
      const params = new URLSearchParams(window.location.search);
      const utm_fields = ['utm_source', 'utm_campaign', 'utm_medium', 'utm_content'];
      let found = false;
      for (const field of utm_fields) {
        if (params.has(field)) {
          sessionStorage.setItem(field, params.get(field));
          found = true;
        }
      }
      if (!found && document.referrer && !sessionStorage.getItem('utm_source')) {
        try {
          const ref = new URL(document.referrer);
          sessionStorage.setItem('utm_source', ref.hostname);
        } catch {}
      }
    })();

    function getUtmParams() {
      return {
        utm_source: sessionStorage.getItem('utm_source') || '',
        utm_campaign: sessionStorage.getItem('utm_campaign') || '',
        utm_medium: sessionStorage.getItem('utm_medium') || '',
        utm_content: sessionStorage.getItem('utm_content') || '',
      };
    }

    function money(n) { return `${Number(n).toLocaleString('ar-DZ')} دج`; }
    function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    function showToast(msg) {
      const t = document.getElementById('successToast'); t.textContent = msg; t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2500);
    }

    // ---------- عرض سلة التسوق مع عدادات الكمية والحذف ----------
    function renderCartDrawer() {
      const items = Cart.get();
      const container = document.getElementById('cartItems');
      container.innerHTML = '';

      if (!items.length) {
        container.innerHTML = '<p class="text-center text-ink font-black mt-10 text-base">السلة فارغة</p>';
        document.getElementById('cartTotal').textContent = money(0);
        return;
      }

      for (const item of items) {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-3 border-b-2 border-ink/20 pb-3';
        const totalPieces = (item.pack_quantity || 1) * item.qty;
        row.innerHTML = `
          <img src="${item.image || '/img/placeholder.svg'}" class="w-14 h-14 object-cover rounded-lg bg-sand-deep border border-gray-100 shadow-2xs" />
          <div class="flex-1">
            <p class="text-sm font-black text-ink line-clamp-1">${escapeHtml(item.name)}${item.variant_label ? ` <span class="text-xs text-forest-dark font-black">(${escapeHtml(item.variant_label)})</span>` : ''}</p>
            <p class="text-xs text-ink font-bold">${money(item.price)} <span class="text-[10px] text-ink/60 font-normal">/ عبوة</span></p>
            <p class="text-[11px] text-forest-dark font-black">المجموع: ${totalPieces} قطعة (${item.qty} عبوة)</p>
            <div class="flex items-center gap-2 mt-1">
              <button class="qty-btn dec btn-outline rounded-lg w-6 h-6 text-sm font-black flex items-center justify-center">-</button>
              <span class="text-sm font-black text-ink">${item.qty} عبوة</span>
              <button class="qty-btn inc btn-outline rounded-lg w-6 h-6 text-sm font-black flex items-center justify-center">+</button>
            </div>
          </div>
          <button class="remove-btn text-terracotta text-xs font-black hover:underline">حذف</button>
        `;
        row.querySelector('.inc').addEventListener('click', () => { Cart.updateQty(item.id, item.variant_id, item.qty + 1); renderCartDrawer(); });
        row.querySelector('.dec').addEventListener('click', () => { Cart.updateQty(item.id, item.variant_id, item.qty - 1); renderCartDrawer(); });
        row.querySelector('.remove-btn').addEventListener('click', () => { Cart.remove(item.id, item.variant_id); renderCartDrawer(); });
        container.appendChild(row);
      }

      document.getElementById('cartTotal').textContent = money(Cart.total());
    }

    function openCart() {
      renderCartDrawer();
      document.getElementById('cartOverlay').classList.remove('hidden');
      document.getElementById('cartDrawer').classList.add('open');
    }

    function closeCart() {
      document.getElementById('cartOverlay').classList.add('hidden');
      document.getElementById('cartDrawer').classList.remove('open');
    }

    document.getElementById('cartBtn').addEventListener('click', openCart);
    document.getElementById('closeCart').addEventListener('click', closeCart);
    document.getElementById('cartOverlay').addEventListener('click', closeCart);

    // ---------- إتمام الطلب (Checkout Modal) داخل صفحة المنتج ----------
    const wilayaSelect = document.getElementById('wilayaSelect');
    const communeSelect = document.getElementById('communeSelect');

    Locations.loadWilayas(wilayaSelect);

    wilayaSelect.addEventListener('change', async () => {
      const code = wilayaSelect.value;
      if (!code) {
        communeSelect.disabled = true;
        communeSelect.innerHTML = '<option value="">البلدية...</option>';
      } else {
        await Locations.loadCommunes(code, communeSelect);
      }
      updateDeliveryPrices();
    });

    document.querySelectorAll('.delivery-option').forEach((label) => {
      label.addEventListener('click', () => {
        document.querySelectorAll('.delivery-option').forEach((l) => l.classList.remove('selected'));
        label.classList.add('selected');
        label.querySelector('input').checked = true;
        CURRENT_DELIVERY_TYPE = label.dataset.type;
        updateDeliveryPrices();
      });
    });

    function currentDeliveryPrice() {
      const rate = Locations.getRate(wilayaSelect.value);
      if (!rate) return 0;
      return CURRENT_DELIVERY_TYPE === 'desk' ? rate.desk_price : rate.home_price;
    }

    
    let CURRENT_DYNAMIC_SHIPPING = null;

    async function updateDeliveryPrices() {
      const code = wilayaSelect.value;
      const subtotal = Cart.total();
      const hint = document.getElementById('selectWilayaHint');
      const storeId = (PRODUCT_DATA && PRODUCT_DATA.user_id) || (Cart.get()[0] && Cart.get()[0].user_id) || CURRENT_STORE_ID;
      
      if (!code || !storeId) {
        document.querySelectorAll('.delivery-option').forEach((label) => {
          label.querySelector('.delivery-price').textContent = '-';
        });
        hint.classList.remove('hidden');
        CURRENT_DYNAMIC_SHIPPING = null;
        updateGrandTotal();
        return;
      }
      
      hint.classList.add('hidden');
      try {
        const homeRes = await fetch(`/api/shipping/calculate-cost?store_id=${storeId}&wilaya_code=${code}&delivery_type=home&subtotal=${subtotal}`);
        const deskRes = await fetch(`/api/shipping/calculate-cost?store_id=${storeId}&wilaya_code=${code}&delivery_type=desk&subtotal=${subtotal}`);
        if (!homeRes.ok || !deskRes.ok) throw new Error('error');
        
        const homeData = await homeRes.json();
        const deskData = await deskRes.json();
        
        document.querySelector('.delivery-option[data-type="home"] .delivery-price').textContent = homeData.is_unavailable ? 'غير متوفر' : money(homeData.price);
        document.querySelector('.delivery-option[data-type="desk"] .delivery-price').textContent = deskData.is_unavailable ? 'غير متوفر' : money(deskData.price);
        
        const selectedData = CURRENT_DELIVERY_TYPE === 'desk' ? deskData : homeData;
        if (selectedData.is_unavailable) throw new Error('unavailable');
        CURRENT_DYNAMIC_SHIPPING = selectedData.price;
      } catch (err) {
        const rate = Locations.getRate(code);
        document.querySelectorAll('.delivery-option').forEach((label) => {
          if (!rate) { label.querySelector('.delivery-price').textContent = '—'; return; }
          const price = label.dataset.type === 'desk' ? rate.desk_price : rate.home_price;
          label.querySelector('.delivery-price').textContent = money(price);
        });
        CURRENT_DYNAMIC_SHIPPING = rate ? (CURRENT_DELIVERY_TYPE === 'desk' ? rate.desk_price : rate.home_price) : 0;
      }
      updateGrandTotal();
    }

    function currentDeliveryPrice() {
      const rate = Locations.getRate(wilayaSelect.value);
      if (!rate) return 0;
      return CURRENT_DELIVERY_TYPE === 'desk' ? rate.desk_price : rate.home_price;
    }

    function updateGrandTotal() {
      const deliveryFee = CURRENT_DYNAMIC_SHIPPING !== null ? CURRENT_DYNAMIC_SHIPPING : currentDeliveryPrice();
      const grand = Cart.total() + (deliveryFee || 0);
      document.getElementById('checkoutGrandTotal').textContent = money(grand);
    }

    function openCheckout() {
      if (!Cart.get().length) {
        showToast('السلة فارغة، يرجى إضافة منتج أولاً ⚠️');
        return;
      }
      closeCart();
      updateGrandTotal();
      document.getElementById('checkoutOverlay').classList.remove('hidden');
    }

    function closeCheckout() {
      document.getElementById('checkoutOverlay').classList.add('hidden');
    }

    document.getElementById('checkoutBtn').addEventListener('click', openCheckout);
    document.getElementById('cancelCheckout').addEventListener('click', closeCheckout);
    document.getElementById('cancelCheckoutHeader').addEventListener('click', closeCheckout);

    // معالج إرسال الطلب (Submit Order)
    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('checkoutError');
      errorEl.classList.add('hidden');

      const submitBtn = document.getElementById('submitOrderBtn');
      const origText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'جارٍ تسجيل الطلب...';

      const storeId = (PRODUCT_DATA && PRODUCT_DATA.user_id) || (Cart.get()[0] && Cart.get()[0].user_id);
      if (!storeId) {
        errorEl.textContent = 'تعذر تحديد المتجر لهذا الطلب. أعد فتح صفحة المتجر وحاول مرة أخرى.';
        errorEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = origText;
        return;
      }
      const payload = {
        customer_name: form.customer_name.value.trim(),
        phone: form.phone.value.trim(),
        address: form.address.value.trim(),
        wilaya_code: Number(wilayaSelect.value),
        commune: communeSelect.value.trim(),
        delivery_type: CURRENT_DELIVERY_TYPE,
        items: Cart.get().map((i) => ({ id: i.id, qty: i.qty, variant_id: i.variant_id || undefined })),
        store_id: storeId,
        ...getUtmParams(),
      };

      if (!payload.wilaya_code || !payload.commune) {
        errorEl.textContent = 'الرجاء اختيار الولاية والبلدية';
        errorEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = origText;
        return;
      }

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'حدث خطأ أثناء إتمام الطلب');

        Cart.clear();
        closeCheckout();
        form.reset();
        communeSelect.disabled = true;
        communeSelect.innerHTML = '<option value="">البلدية...</option>';
        showToast(`تم تسجيل طلبك بنجاح 🎉 رقم الطلب: ${data.order_id}`);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = origText;
      }
    });

    // ---------- معرض الصور والمُكبِّر ----------
    let GALLERY_IMAGES = [];
    let GALLERY_INDEX = 0;
    let PRODUCT_DATA = null;
    let SELECTED_COLOR = null;
    let SELECTED_SIZE = null;
    let SELECTED_VARIANT = null;

    function renderMainImage(customSrc = null) {
      const img = document.getElementById('mainProductImage');
      if (!img) return;
      const targetSrc = customSrc || GALLERY_IMAGES[GALLERY_INDEX] || '/img/placeholder.svg';
      
      img.style.opacity = '0.5';
      setTimeout(() => {
        img.src = targetSrc;
        img.style.opacity = '1';
      }, 100);

      document.querySelectorAll('.thumb-btn').forEach((t, i) => {
        const isCurrent = (t.dataset.src === targetSrc) || (i === GALLERY_INDEX && !customSrc);
        t.classList.toggle('border-forest', isCurrent);
        t.classList.toggle('border-ink/20', !isCurrent);
      });
    }

    function goToImage(index) {
      GALLERY_INDEX = (index + GALLERY_IMAGES.length) % GALLERY_IMAGES.length;
      renderMainImage();
      if (!document.getElementById('lightbox').classList.contains('hidden')) renderLightbox();
    }

    function openLightbox(index) {
      GALLERY_INDEX = index;
      renderLightbox();
      const lb = document.getElementById('lightbox');
      lb.classList.remove('hidden');
      lb.classList.add('flex');
    }
    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      lb.classList.add('hidden');
      lb.classList.remove('flex');
    }
    function renderLightbox() {
      document.getElementById('lightboxImg').src = GALLERY_IMAGES[GALLERY_INDEX] || '/img/placeholder.svg';
      document.getElementById('lightboxCounter').textContent = `${GALLERY_INDEX + 1} / ${GALLERY_IMAGES.length}`;
      document.getElementById('lightboxPrev').classList.toggle('hidden', GALLERY_IMAGES.length <= 1);
      document.getElementById('lightboxNext').classList.toggle('hidden', GALLERY_IMAGES.length <= 1);
    }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
    document.getElementById('lightboxPrev').addEventListener('click', () => goToImage(GALLERY_INDEX - 1));
    document.getElementById('lightboxNext').addEventListener('click', () => goToImage(GALLERY_INDEX + 1));
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('lightbox').classList.contains('hidden')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') goToImage(GALLERY_INDEX + 1);
      if (e.key === 'ArrowRight') goToImage(GALLERY_INDEX - 1);
    });

    function enableSwipe(el, onSwipeLeft, onSwipeRight) {
      let startX = 0;
      el.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
      el.addEventListener('touchend', (e) => {
        const diff = e.changedTouches[0].clientX - startX;
        if (Math.abs(diff) < 40) return;
        if (diff < 0) onSwipeLeft(); else onSwipeRight();
      }, { passive: true });
    }
    enableSwipe(document.getElementById('lightbox'), () => goToImage(GALLERY_INDEX + 1), () => goToImage(GALLERY_INDEX - 1));

    (async function init() {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');
      const el = document.getElementById('productDetail');
      if (!slug) { el.innerHTML = '<p class="text-center text-ink/40 py-20 font-bold">منتج غير موجود</p>'; return; }

      const storeId = params.get('store_id');
      const storeSlug = params.get('store_slug');
      const storeQuery = storeId ? `&store_id=${encodeURIComponent(storeId)}` : (storeSlug ? `&store_slug=${encodeURIComponent(storeSlug)}` : '');
      const res = await fetch(`/api/products?slug=${encodeURIComponent(slug)}${storeQuery}`);
      const all = await res.json();
      const product = all[0];

      if (!product) { el.innerHTML = '<p class="text-center text-ink/40 py-20 font-bold">منتج غير موجود</p>'; return; }
      PRODUCT_DATA = product;
      initSocialIcons('socialIconsProductFooter', { storeId: product.user_id });

      let allImages = (product.images && product.images.length) ? [...product.images] : [product.image || '/img/placeholder.svg'];
      if (product.variants) {
        for (const v of product.variants) {
          if (v.image && !allImages.includes(v.image)) {
            allImages.push(v.image);
          }
        }
      }
      GALLERY_IMAGES = allImages.filter(Boolean);
      GALLERY_INDEX = 0;

      const thumbsHtml = GALLERY_IMAGES.length > 1
        ? `<div id="galleryThumbs" class="flex gap-2 mt-3 overflow-x-auto no-scrollbar pb-1">
            ${GALLERY_IMAGES.map((img, i) => `
              <button class="thumb-btn w-16 h-16 shrink-0 rounded-xl overflow-hidden border-2 transition-all ${i === 0 ? 'border-forest ring-2 ring-forest/30' : 'border-ink/20 opacity-80'}" data-index="${i}" data-src="${img}">
                <img src="${img}" class="w-full h-full object-contain p-1" />
              </button>
            `).join('')}
          </div>`
        : '';

      el.innerHTML = `
        <div class="grid md:grid-cols-2 gap-8">
          <div>
            <div id="mainImageWrap" class="aspect-square bg-gray-200 animate-pulse rounded-2xl overflow-hidden border border-gray-100 relative cursor-zoom-in group shadow-sm">
              <img id="mainProductImage" src="${GALLERY_IMAGES[0]}" class="w-full h-full object-contain p-2 transition-opacity duration-700 opacity-0 ${product.stock <= 0 ? 'grayscale' : ''}" onload="this.classList.remove('opacity-0'); this.parentElement.classList.remove('animate-pulse'); this.parentElement.classList.add('bg-white');" />
              ${product.stock <= 0 ? '<span class="absolute top-3 right-3 bg-ink text-white text-xs font-extrabold px-3 py-1.5 rounded-full shadow">نفد المخزون</span>' : ''}
              <span class="absolute bottom-2 left-2 bg-ink/75 backdrop-blur-sm text-white text-[11px] font-bold px-2.5 py-1 rounded-full pointer-events-none">🔍 اضغط للتكبير</span>
            </div>
            ${thumbsHtml}
          </div>
          <div class="flex flex-col">
            <h1 class="font-display text-3xl md:text-4xl mb-2 text-ink font-black">${escapeHtml(product.name)}</h1>
            ${(() => {
              const isWholesale = (product.pack_quantity || 1) > 1;
              const packQty = product.pack_quantity || 1;
              return `
            <div class="flex flex-col gap-1 mb-4 bg-sand/60 border border-gray-100/20 rounded-2xl p-4">
              <div class="flex items-center justify-between">
                <span id="displayPrice" class="price-ticket lg inline-flex font-black">${money(product.price)}</span>
                ${isWholesale
                  ? `<span class="text-xs bg-forest text-white font-black px-3 py-1 rounded-full">عبوة (${packQty} قطعة)</span>`
                  : `<span class="text-xs bg-amber-500 text-white font-black px-3 py-1 rounded-full">قطعة واحدة</span>`
                }
              </div>
              ${isWholesale
                ? `<p class="text-xs font-bold text-ink/70">سعر القطعة داخل العبوة: <span class="text-forest-dark font-black">${money(Math.round(product.price / packQty))}</span></p>`
                : ''
              }
            </div>`;
            })()}
            
            <p class="text-ink font-semibold leading-relaxed mb-6 whitespace-pre-line text-sm bg-white/75 p-4 rounded-2xl border border-gray-100/20 shadow-2xs">${escapeHtml(product.description || 'لا يوجد وصف لهذا المنتج بعد.')}</p>
            
            <!-- قسم اختيار الألوان والمقاسات التفاعلي -->
            <div id="variantsContainer" class="space-y-5 mb-6"></div>

            <!-- عداد الكمية + أزرار الشراء الفوري والإضافة للسلة -->
            <div class="mt-auto pt-4 border-t-2 border-ink/20 space-y-3">
              ${(() => {
                const isWholesale = (product.pack_quantity || 1) > 1;
                const packQty = product.pack_quantity || 1;
                return `
              <div class="flex items-center justify-between gap-3 bg-white border border-gray-100/20 p-3 rounded-xl">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-black text-ink">${isWholesale ? 'عدد العبوات:' : 'الكمية:'}</span>
                  <div class="flex items-center gap-1.5 bg-sand-deep border border-gray-100 rounded-lg px-2 py-0.5 shadow-2xs">
                    <button id="qtyDecBtn" class="w-7 h-7 rounded-md font-black text-base flex items-center justify-center hover:bg-sand transition-colors">-</button>
                    <input id="productQtyInput" type="number" min="1" value="1" class="w-10 text-center font-black text-sm text-ink outline-none bg-transparent" />
                    <button id="qtyIncBtn" class="w-7 h-7 rounded-md font-black text-base flex items-center justify-center hover:bg-sand transition-colors">+</button>
                  </div>
                </div>
                ${isWholesale ? `
                <div class="text-left">
                  <span class="text-[11px] text-ink/60 font-bold block">إجمالي القطع في العبوة</span>
                  <span id="calculatedTotalPieces" class="text-sm font-black text-forest-dark">${packQty} قطعة</span>
                </div>` : `<div id="calculatedTotalPieces" class="hidden"></div>`}
              </div>

              <div class="flex flex-wrap items-center gap-3">
                <button id="buyNowBtn" class="btn-primary flex-1 py-3.5 px-6 rounded-xl font-black text-base shadow-md flex items-center justify-center gap-2 transition-all active:scale-[0.98] bg-forest text-white" ${product.stock <= 0 ? 'disabled style="opacity:.5;cursor:not-allowed"' : ''}>
                  <span>⚡</span>
                  <span>${product.stock <= 0 ? 'غير متوفر حاليًا' : (isWholesale ? 'اطلب الآن (عبوة كاملة)' : 'اطلب الآن ⚡')}</span>
                </button>
                <button id="addBtn" class="btn-outline flex-1 py-3.5 px-6 rounded-xl font-black text-base shadow-md flex items-center justify-center gap-2 transition-all active:scale-[0.98]" ${product.stock <= 0 ? 'disabled style="opacity:.5;cursor:not-allowed"' : ''}>
                  <span>🛒</span>
                  <span id="addBtnText">${product.stock <= 0 ? 'غير متوفر' : (isWholesale ? 'أضف العبوة للسلة' : 'أضف للسلة')}</span>
                </button>
              </div>`;
              })()}

              <div id="productSocialIcons" class="flex gap-2 pt-1"></div>
              <p id="variantHint" class="text-xs text-rose-700 font-black mt-2 hidden flex items-center gap-1">⚠️ <span id="variantHintText">الرجاء اختيار المواصفات المطلوبة</span></p>
            </div>
          </div>
        </div>
      `;

      renderMainImage();
      setupVariantSelectors(product);

      // إدارة أزرار عداد الكمية
      const qtyInput = document.getElementById('productQtyInput');
      const qtyDec = document.getElementById('qtyDecBtn');
      const qtyInc = document.getElementById('qtyIncBtn');

      const updatePiecesCount = () => {
        const val = parseInt(qtyInput.value, 10) || 1;
        const totalPieces = val * (product.pack_quantity || 1);
        const piecesEl = document.getElementById('calculatedTotalPieces');
        if (piecesEl) piecesEl.textContent = `${totalPieces} قطعة`;
      };

      const unitLabel = (product.pack_quantity || 1) > 1 ? 'عبوة' : 'قطعة';

      if (qtyDec && qtyInc && qtyInput) {
        qtyDec.addEventListener('click', () => {
          let val = parseInt(qtyInput.value, 10) || 1;
          if (val > 1) {
            qtyInput.value = val - 1;
            PRODUCT_QTY = val - 1;
            updatePiecesCount();
          }
        });
        qtyInc.addEventListener('click', () => {
          let val = parseInt(qtyInput.value, 10) || 1;
          const maxStock = SELECTED_VARIANT ? SELECTED_VARIANT.stock : product.stock;
          if (val < maxStock) {
            qtyInput.value = val + 1;
            PRODUCT_QTY = val + 1;
            updatePiecesCount();
          } else {
            showToast(`الكمية المتوفرة بالمخزون ${maxStock} ${unitLabel} فقط ⚠️`);
          }
        });
        qtyInput.addEventListener('change', () => {
          let val = parseInt(qtyInput.value, 10) || 1;
          const maxStock = SELECTED_VARIANT ? SELECTED_VARIANT.stock : product.stock;
          if (val < 1) val = 1;
          if (val > maxStock) {
            val = maxStock;
            showToast(`الكمية المتوفرة بالمخزون ${maxStock} ${unitLabel} فقط ⚠️`);
          }
          qtyInput.value = val;
          PRODUCT_QTY = val;
          updatePiecesCount();
        });
      }

      document.getElementById('mainImageWrap').addEventListener('click', (e) => {
        if (e.target.closest('#galleryPrev') || e.target.closest('#galleryNext')) return;
        openLightbox(GALLERY_INDEX);
      });
      enableSwipe(document.getElementById('mainImageWrap'), () => goToImage(GALLERY_INDEX + 1), () => goToImage(GALLERY_INDEX - 1));

      // دالة مساعدة للتحقق من المتغيرات وإضافة الكمية المحددة للسلة
      function handleAddProduct(isDirectCheckout = false) {
        const hint = document.getElementById('variantHint');
        const hintText = document.getElementById('variantHintText');
        const quantityToAdd = parseInt(document.getElementById('productQtyInput')?.value, 10) || 1;
        
        if (product.has_variants) {
          const hasColors = product.variants.some((v) => v.color);
          const hasSizes = product.variants.some((v) => v.size);

          if (hasColors && !SELECTED_COLOR) {
            hintText.textContent = 'الرجاء اختيار اللون أولاً';
            hint.classList.remove('hidden');
            return false;
          }

          if (!SELECTED_VARIANT) {
            hintText.textContent = hasSizes ? 'الرجاء اختيار المقاس أولاً' : 'الرجاء اختيار الخيار المطلوب';
            hint.classList.remove('hidden');
            return false;
          }

          if (SELECTED_VARIANT.stock <= 0) {
            showToast(`عذرًا، هذا الخيار (${SELECTED_VARIANT.label || SELECTED_VARIANT.color}) نفد من المخزون ⚠️`);
            return false;
          }

          const inCart = Cart.get().find((i) => i.id === product.id && i.variant_id === SELECTED_VARIANT.id);
          const currentQty = inCart ? inCart.qty : 0;
          if (currentQty + quantityToAdd > SELECTED_VARIANT.stock) {
            showToast(`الكمية المتوفرة من "${SELECTED_VARIANT.label || SELECTED_VARIANT.color}" هي ${SELECTED_VARIANT.stock} فقط ⚠️`);
            return false;
          }

          Cart.add(product, quantityToAdd, SELECTED_VARIANT, SELECTED_VARIANT.image || (SELECTED_COLOR ? SELECTED_COLOR.image : null));
          hint.classList.add('hidden');
        } else {
          // منتج بسيط
          const inCart = Cart.get().find((i) => i.id === product.id && !i.variant_id);
          const currentQty = inCart ? inCart.qty : 0;
          if (currentQty + quantityToAdd > product.stock) {
            showToast(`الكمية المتوفرة من هذا المنتج ${product.stock} فقط ⚠️`);
            return false;
          }
          Cart.add(product, quantityToAdd);
        }

        if (isDirectCheckout) {
          openCheckout();
        } else {
          showToast('تمت إضافة المنتج إلى السلة بنجاح ✅');
          openCart();
        }
        return true;
      }

      // معالجة زر الإضافة للسلة وزر الشراء الفوري
      if (product.stock > 0) {
        document.getElementById('addBtn').addEventListener('click', () => handleAddProduct(false));
        document.getElementById('buyNowBtn').addEventListener('click', () => handleAddProduct(true));
      }

      initSocialIcons('productSocialIcons', { size: 'w-11 h-11 text-xl' });
    })();

    // ---------- نظام الألوان والمقاسات التفاعلي ----------
    function setupVariantSelectors(product) {
      const container = document.getElementById('variantsContainer');
      if (!product.has_variants || !product.variants || !product.variants.length) {
        container.innerHTML = '';
        return;
      }

      const variants = product.variants;
      const distinctColors = [];
      const colorMap = new Map();

      for (const v of variants) {
        if (v.color && v.color.trim()) {
          const cName = v.color.trim();
          if (!colorMap.has(cName)) {
            const cObj = {
              name: cName,
              code: v.color_code || '#17241F',
              image: v.image || '',
              variants: [],
            };
            colorMap.set(cName, cObj);
            distinctColors.push(cObj);
          }
          colorMap.get(cName).variants.push(v);
        }
      }

      if (distinctColors.length > 0) {
        container.innerHTML = `
          <!-- اختيار اللون -->
          <div class="color-section">
            <div class="flex items-center justify-between mb-2">
              <span class="text-sm font-black text-ink">اللون: <span id="selectedColorName" class="text-forest font-black mr-1 text-base">اختر لونًا</span></span>
            </div>
            <div id="colorSwatches" class="flex flex-wrap gap-2.5 items-center"></div>
          </div>

          <!-- اختيار المقاس -->
          <div id="sizeSection" class="size-section">
            <div class="flex items-center justify-between mb-2">
              <span class="text-sm font-black text-ink">المقاس: <span id="selectedSizeName" class="text-forest font-black mr-1 text-base">اختر مقاسًا</span></span>
            </div>
            <div id="sizeButtons" class="flex flex-wrap gap-2"></div>
          </div>
          
          <div id="stockAvailability" class="text-xs font-black text-ink min-h-[18px]"></div>
        `;

        const colorSwatchesWrap = document.getElementById('colorSwatches');
        distinctColors.forEach((colorObj) => {
          const totalStockForColor = colorObj.variants.reduce((sum, v) => sum + v.stock, 0);
          const isOutOfStock = totalStockForColor <= 0;

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `color-swatch-btn group relative flex items-center gap-2 px-3 py-1.5 rounded-full border-2 transition-all ${
            isOutOfStock ? 'opacity-40 cursor-not-allowed border-ink/40' : 'border-ink hover:border-forest bg-white'
          }`;
          btn.dataset.color = colorObj.name;

          btn.innerHTML = `
            <span class="w-5 h-5 rounded-full border border-ink shadow-inner shrink-0" style="background-color: ${colorObj.code || '#ddd'}"></span>
            <span class="text-xs font-black text-ink">${escapeHtml(colorObj.name)}</span>
            ${isOutOfStock ? '<span class="text-[10px] text-ink font-bold">(نفد)</span>' : ''}
          `;

          btn.addEventListener('click', () => {
            selectColor(colorObj);
          });

          colorSwatchesWrap.appendChild(btn);
        });

        const firstAvailable = distinctColors.find(c => c.variants.some(v => v.stock > 0)) || distinctColors[0];
        if (firstAvailable) {
          selectColor(firstAvailable);
        }

      } else {
        container.innerHTML = `
          <div>
            <p class="text-sm font-black text-ink mb-2.5">اختر المقاس / الحجم:</p>
            <div id="simpleSizeButtons" class="flex flex-wrap gap-2">
              ${variants.map((v) => `
                <button type="button" class="variant-btn px-4 py-2 rounded-xl border-2 text-sm font-black transition-all ${
                  v.stock <= 0 ? 'opacity-40 cursor-not-allowed border-ink/40 bg-sand-deep text-ink' : 'border-ink hover:border-forest bg-white text-ink'
                }"
                  data-vid="${v.id}" ${v.stock <= 0 ? 'disabled' : ''}>
                  ${escapeHtml(v.label || v.size || 'خيار')}${v.stock <= 0 ? ' (نفد)' : ''}
                </button>
              `).join('')}
            </div>
            <div id="stockAvailability" class="text-xs font-black text-ink mt-2 min-h-[18px]"></div>
          </div>
        `;

        container.querySelectorAll('.variant-btn:not([disabled])').forEach((btn) => {
          btn.addEventListener('click', () => {
            container.querySelectorAll('.variant-btn').forEach((b) => {
              b.classList.remove('border-forest', 'bg-forest', 'text-white', 'shadow-md');
              b.classList.add('border-ink', 'bg-white', 'text-ink');
            });
            btn.classList.remove('border-ink', 'bg-white', 'text-ink');
            btn.classList.add('border-forest', 'bg-forest', 'text-white', 'shadow-md');

            const variant = variants.find((v) => String(v.id) === btn.dataset.vid);
            SELECTED_VARIANT = variant;
            document.getElementById('variantHint').classList.add('hidden');

            const stockEl = document.getElementById('stockAvailability');
            if (stockEl && variant) {
              stockEl.textContent = `المتوفر في المخزون: ${variant.stock} قطعة`;
            }

            if (variant && variant.image) {
              renderMainImage(variant.image);
            }
          });
        });

        const firstInStock = container.querySelector('.variant-btn:not([disabled])');
        if (firstInStock) firstInStock.click();
      }
    }

    function selectColor(colorObj) {
      SELECTED_COLOR = colorObj;
      SELECTED_SIZE = null;
      SELECTED_VARIANT = null;

      document.getElementById('selectedColorName').textContent = colorObj.name;
      document.querySelectorAll('.color-swatch-btn').forEach((btn) => {
        const isActive = btn.dataset.color === colorObj.name;
        btn.classList.toggle('border-forest', isActive);
        btn.classList.toggle('ring-2', isActive);
        btn.classList.toggle('ring-forest/30', isActive);
        btn.classList.toggle('bg-forest/10', isActive);
      });

      if (colorObj.image) {
        renderMainImage(colorObj.image);
        const matchingThumb = document.querySelector(`.thumb-btn[data-src="${colorObj.image}"]`);
        if (matchingThumb) {
          GALLERY_INDEX = Number(matchingThumb.dataset.index);
        }
      } else if (colorObj.variants.length && colorObj.variants[0].image) {
        renderMainImage(colorObj.variants[0].image);
      }

      renderSizesForColor(colorObj);
      document.getElementById('variantHint').classList.add('hidden');
    }

    function renderSizesForColor(colorObj) {
      const sizeWrap = document.getElementById('sizeButtons');
      const sizeLabel = document.getElementById('selectedSizeName');
      sizeWrap.innerHTML = '';
      sizeLabel.textContent = 'اختر مقاسًا';

      const variants = colorObj.variants || [];
      if (!variants.length) {
        sizeWrap.innerHTML = '<p class="text-xs text-ink/40">لا توجد مقاسات مسجلة لهذا اللون</p>';
        return;
      }

      variants.forEach((v) => {
        const isOutOfStock = v.stock <= 0;
        const sizeText = v.size || v.label || 'مقاس موحد';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `size-btn min-w-[44px] h-10 px-3.5 rounded-xl border-2 text-xs font-black transition-all flex items-center justify-center ${
          isOutOfStock
            ? 'opacity-40 cursor-not-allowed border-ink/20 bg-ink/5 text-ink/40'
            : 'border-ink/20 bg-white text-ink hover:border-ink shadow-sm'
        }`;
        btn.dataset.vid = v.id;
        btn.dataset.size = sizeText;
        if (isOutOfStock) btn.disabled = true;

        btn.innerHTML = `${escapeHtml(sizeText)}${isOutOfStock ? ' <span class="text-[9px] mr-1">(نفد)</span>' : ''}`;

        btn.addEventListener('click', () => {
          selectSize(v, btn);
        });

        sizeWrap.appendChild(btn);
      });

      const firstAvailableSizeBtn = sizeWrap.querySelector('.size-btn:not([disabled])');
      if (firstAvailableSizeBtn) {
        firstAvailableSizeBtn.click();
      } else {
        document.getElementById('stockAvailability').textContent = 'نفد المخزون من هذا اللون';
      }
    }

    function selectSize(variant, btnEl) {
      SELECTED_VARIANT = variant;
      SELECTED_SIZE = variant.size || variant.label;
      document.getElementById('selectedSizeName').textContent = SELECTED_SIZE;

      document.querySelectorAll('#sizeButtons .size-btn').forEach((b) => {
        b.classList.remove('border-forest', 'bg-forest', 'text-white', 'shadow-md');
        b.classList.add('border-ink/20', 'bg-white', 'text-ink');
      });
      btnEl.classList.remove('border-ink/20', 'bg-white', 'text-ink');
      btnEl.classList.add('border-forest', 'bg-forest', 'text-white', 'shadow-md');

      const stockEl = document.getElementById('stockAvailability');
      if (stockEl) {
        stockEl.textContent = `المتوفر في المخزون: ${variant.stock} قطعة`;
      }
      document.getElementById('variantHint').classList.add('hidden');

      // إذا كان للمقاس صورة خاصة منفردة
      if (variant.image) {
        renderMainImage(variant.image);
      }
    }

  </script>

  <!-- Bottom Mobile Navbar -->
  <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 z-50 flex justify-around items-center h-16 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]" style="padding-bottom: env(safe-area-inset-bottom);">
    <a href="/" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-black transition-colors">
      <span class="text-xl mb-1">🏠</span>
      <span class="text-[10px] font-bold">الرئيسية</span>
    </a>
    <button onclick="document.getElementById('searchInputMobile')?.focus(); window.scrollTo({top: 0, behavior: 'smooth'});" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-black transition-colors">
      <span class="text-xl mb-1">🔍</span>
      <span class="text-[10px] font-bold">بحث</span>
    </button>
    <button onclick="openCart()" class="relative flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-black transition-colors">
      <span class="text-xl mb-1">🛒</span>
      <span class="text-[10px] font-bold">السلة</span>
      <span id="bottomCartCount" class="absolute top-1 right-5 bg-rose-500 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-sm">0</span>
    </button>
  </nav>
</body>
</html>
