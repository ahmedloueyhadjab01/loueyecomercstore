<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>متجري</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Almarai', 'sans-serif'], display: ['Lalezar', 'sans-serif'] },
        colors: { ink: '#17241F', forest: '#1E6F54', terracotta: '#2F6690', gold: '#C9A227', sand: '#FAF3E6' }
      }
    }
  }
</script>
</head>
<body class="font-sans bg-sand text-ink">

  <!-- شريط علوي رفيع لأيقونات التواصل الاجتماعي (يختفي تلقائيًا إن لم تكن هناك روابط) -->
  <div id="socialIconsTopBar" class="flex justify-center gap-2 py-1.5 bg-ink"></div>

  <!-- الهيدر -->
  <header class="brand-header sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <a href="/" class="text-3xl brand-logo">متجري</a>
      <div class="hidden md:flex flex-1 max-w-md">
        <input id="searchInput" type="text" placeholder="ابحث عن منتج..."
          class="field w-full px-4 py-2 text-sm" />
      </div>
      <button id="cartBtn" class="btn-primary relative flex items-center gap-2 px-5 py-2 rounded-full text-sm font-extrabold">
        🛒 السلة
        <span id="cartCount" class="absolute -top-2 -left-2 bg-gold text-ink text-xs font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-ink">0</span>
      </button>
    </div>
    <div class="md:hidden px-4 pb-3">
      <input id="searchInputMobile" type="text" placeholder="ابحث عن منتج..." class="field w-full px-4 py-2 text-sm" />
    </div>
  </header>

  <!-- شريط التصنيفات: تصنيفات رئيسية، وعند الضغط على واحد تظهر تصنيفاته الفرعية تحته -->
  <nav class="max-w-7xl mx-auto px-4 pt-4">
    <div id="categoryNav" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
      <button data-cat="" class="cat-btn active-cat whitespace-nowrap px-4 py-1.5 rounded-full text-sm">الكل</button>
    </div>
    <div id="subCategoryNav" class="hidden flex gap-2 overflow-x-auto no-scrollbar pt-2 pb-3"></div>
  </nav>

  <!-- شبكة المنتجات -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5"></div>
    <p id="emptyState" class="hidden text-center text-ink/50 py-20 font-bold">لا توجد منتجات حاليًا في هذا التصنيف.</p>
  </main>

  <footer class="border-t-2 border-ink mt-10 py-8 text-center text-sm">
    <p class="font-display text-2xl text-forest-dark mb-3">تابعنا</p>
    <div id="socialIconsFooter" class="flex justify-center gap-3 mb-4 flex-wrap"></div>
    <p class="text-ink/60">© 2026 متجري - جميع الحقوق محفوظة</p>
  </footer>

  <!-- سلة التسوق (Drawer) -->
  <div id="cartOverlay" class="fixed inset-0 bg-ink/40 hidden z-50"></div>
  <aside id="cartDrawer" class="fixed top-0 left-0 h-full w-full max-w-sm bg-sand z-50 translate-x-[-100%] transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-4 border-b-2 border-ink flex items-center justify-between">
      <h2 class="font-display text-2xl">سلة التسوق</h2>
      <button id="closeCart" class="text-2xl leading-none">&times;</button>
    </div>
    <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <div class="p-4 border-t-2 border-ink">
      <div class="flex justify-between items-center font-extrabold mb-3">
        <span>الإجمالي</span>
        <span id="cartTotal" class="price-ticket lg">0 دج</span>
      </div>
      <button id="checkoutBtn" class="btn-primary w-full py-3 rounded-xl font-extrabold">إتمام الطلب</button>
    </div>
  </aside>

  <!-- نموذج إتمام الطلب -->
  <div id="checkoutOverlay" class="fixed inset-0 bg-ink/40 hidden z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-sand border-2 border-ink rounded-2xl w-full max-w-md p-6 my-8">
      <h2 class="font-display text-2xl mb-4">معلومات التوصيل</h2>
      <form id="checkoutForm" class="space-y-3">
        <input required name="customer_name" placeholder="الاسم الكامل" class="field w-full px-3 py-2 text-sm" />
        <input required name="phone" placeholder="رقم الهاتف" class="field w-full px-3 py-2 text-sm" />

        <div class="grid grid-cols-2 gap-2">
          <select required id="wilayaSelect" name="wilaya_code" class="field w-full px-3 py-2 text-sm">
            <option value="">الولاية...</option>
          </select>
          <select required id="communeSelect" name="commune" class="field w-full px-3 py-2 text-sm" disabled>
            <option value="">البلدية...</option>
          </select>
        </div>

        <textarea required name="address" placeholder="العنوان بالتفصيل (الحي، الشارع، رقم المنزل...)" class="field w-full px-3 py-2 text-sm" rows="2"></textarea>

        <div>
          <p class="text-xs font-bold text-ink/60 mb-2">طريقة التوصيل</p>
          <div class="grid grid-cols-2 gap-2">
            <label class="delivery-option flex flex-col items-center py-3 px-2 text-center" data-type="home">
              <input type="radio" name="delivery_type" value="home" class="hidden" checked />
              <span class="text-lg">🏠</span>
              <span class="text-xs font-bold mt-1">للمنزل</span>
              <span class="delivery-price text-xs mt-1">—</span>
            </label>
            <label class="delivery-option flex flex-col items-center py-3 px-2 text-center" data-type="desk">
              <input type="radio" name="delivery_type" value="desk" class="hidden" />
              <span class="text-lg">🏤</span>
              <span class="text-xs font-bold mt-1">مكتب البريد</span>
              <span class="delivery-price text-xs mt-1">—</span>
            </label>
          </div>
          <p id="selectWilayaHint" class="text-xs text-ink/50 mt-1">اختر الولاية أولًا لمعرفة سعر التوصيل</p>
        </div>

        <div class="flex justify-between items-center pt-2 border-t-2 border-dashed border-ink/30">
          <span class="text-sm font-bold">إجمالي الطلب مع التوصيل</span>
          <span id="checkoutGrandTotal" class="price-ticket">0 دج</span>
        </div>

        <p id="checkoutError" class="text-terracotta text-sm font-bold hidden"></p>
        <div class="flex gap-2 pt-2">
          <button type="button" id="cancelCheckout" class="btn-outline flex-1 py-2 rounded-lg text-sm font-extrabold">إلغاء</button>
          <button type="submit" class="btn-primary flex-1 py-2 rounded-lg text-sm font-extrabold">تأكيد الطلب</button>
        </div>
      </form>
    </div>
  </div>

  <!-- رسالة نجاح -->
  <div id="successToast" class="hidden fixed bottom-6 right-6 bg-forest text-white px-5 py-3 rounded-xl shadow-lg z-[60] font-bold border-2 border-forest-dark"></div>

  <script src="/js/social.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/locations.js"></script>
  <script src="/js/store.js"></script>
  <script>
    initSocialIcons('socialIconsFooter');
    initSocialIcons('socialIconsTopBar', { size: 'w-7 h-7 text-sm' });
  </script>
</body>
</html>
